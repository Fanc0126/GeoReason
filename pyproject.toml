[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georeason"
version = "0.1.0"
description = "GeoReason: Bridging Logical Reasoning and Spatial Fidelity in Remote Sensing Segmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0",
  "transformers==4.57.1", "peft==0.17.1", "huggingface-hub==0.36.0",
  "accelerate==1.12.0", "safetensors>=0.5", "qwen-vl-utils==0.0.14",
  "numpy<3", "Pillow>=10", "pycocotools>=2.0.10", "PyYAML>=6", "tqdm>=4.66"
]

[tool.setuptools.packages.find]
include = ["georeason*"]
